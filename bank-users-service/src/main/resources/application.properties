# ==========================================================================
# bank-users-service — configuração
#
# Em dev/test, com Docker disponível, o Quarkus Dev Services sobe
# automaticamente um PostgreSQL e um MongoDB em containers — não é preciso
# configurar URL/usuário/senha. Para apontar para bancos reais, defina as
# propriedades comentadas abaixo (ou via variáveis de ambiente).
# ==========================================================================

quarkus.http.port=8080

# --- PostgreSQL: usuários, chaves pix e saldo ---------------------------
quarkus.datasource.db-kind=postgresql
# quarkus.datasource.username=bank
# quarkus.datasource.password=bank
# quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/bank_users

# Recria o schema a cada boot. Os dados de exemplo são carregados por 
# DevDataSeeder. Em produção troque para 'none' e use migrações
# (Flyway/Liquibase).
quarkus.hibernate-orm.database.generation=drop-and-create

# --- MongoDB: lista de contatos recentes --------------------------------
quarkus.mongodb.database=bank_users
# quarkus.mongodb.connection-string=mongodb://localhost:27017

# --- Testes --------------------------------------------------------------
# Os testes unitários mockam a persistência (PanacheMock/@InjectMock), então o
# seeder de exemplo não deve rodar e sujar/atrasar o boot da aplicação de teste.
%test.quarkus.arc.exclude-types=br.edu.ufrj.tcc.bootstrap.DevDataSeeder

# --- Logs ----------------------------------------------------------------
quarkus.log.category."br.edu.ufrj.tcc".level=DEBUG
